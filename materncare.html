<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaternCare — Antenatal Desk</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f8fb;color:#18212f}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:230px;background:#173b57;color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:22px;font-weight:700;margin:5px 8px 4px}.sub{font-size:12px;opacity:.75;margin:0 8px 25px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dce8f1;padding:12px;border-radius:9px;margin:4px 0}.nav button.active,.nav button:hover{background:#285875;color:#fff}.main{margin-left:230px;width:calc(100% - 230px);padding:24px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.badge{padding:7px 11px;border-radius:20px;background:#e5f7ed;color:#197345;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e3e8ee;border-radius:14px;padding:18px;box-shadow:0 2px 8px #00000008}.num{font-size:28px;font-weight:700;margin-top:7px}.muted{color:#687587;font-size:13px}.section{margin-top:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.primary{border:0;background:#23658a;color:#fff;padding:10px 15px;border-radius:9px}.secondary{border:1px solid #ccd5df;background:#fff;padding:9px 14px;border-radius:9px}.danger{color:#a72b2b}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #e9edf2;font-size:14px}.search{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:9px;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.dialog{background:#fff;border-radius:15px;max-width:650px;width:100%;max-height:90vh;overflow:auto;padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #ccd5df;border-radius:8px}.field textarea{min-height:80px}.full{grid-column:1/-1}.empty{padding:25px;text-align:center;color:#687587}.alert{border-left:4px solid #d88918;background:#fff8e9;padding:13px;border-radius:8px;margin:8px 0}.good{border-left-color:#29945d;background:#eefaf3}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{background:#eef2f6;border-radius:18px;padding:6px 10px;font-size:12px}.small{font-size:12px}.notice{background:#edf5fb;border:1px solid #cfe1ee;padding:12px;border-radius:10px;margin-top:15px}@media(max-width:800px){.side{width:72px;padding:12px 8px}.brand{font-size:0}.brand:after{content:'MC';font-size:20px}.sub{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:22px}.main{margin-left:72px;width:calc(100% - 72px);padding:14px}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start}.table{min-width:720px}.tablewrap{overflow:auto}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">MaternCare</div><div class="sub">Antenatal desk</div><nav class="nav"><button data-page="overview">Overview</button><button data-page="patients">Patients</button><button data-page="appointments">Appointments</button><button data-page="observations">Observations</button><button data-page="referrals">Referral support</button><button data-page="settings">Settings</button></nav></aside><main class="main"><div id="app"></div></main></div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
const key='materncare_demo_v2';
const initial={patients:[{id:'p1',name:'Fatima Noor',village:'Test Village',phone:'077000000',preg:'G1 P0',due:'2026-08-17'},{id:'p2',name:'SanaAhmad',village:'Demo Village',phone:'0774059254',preg:'G1 P0',due:''},{id:'p3',name:'Maryam Ahmad',village:'Demo Village',phone:'0774059254',preg:'G1 P0',due:'2027-06-06'},{id:'p4',name:'Ama Osei',village:'Kwaso',phone:'024 555 0182',preg:'G2 P1',due:'2027-01-31'},{id:'p5',name:'Lina Mensah',village:'Asempanaye',phone:'020 482 1106',preg:'G1 P0',due:'2027-04-16'},{id:'p6',name:'Nia Boateng',village:'North Ridge',phone:'055 310 7633',preg:'G2 P1',due:'2026-12-06'}],visits:[{id:'v1',patient:'p3',type:'Routine antenatal',date:'2026-10-17',time:'09:30',status:'Scheduled',reminder:true},{id:'v2',patient:'p1',type:'Routine antenatal',date:'2026-10-16',time:'09:30',status:'Scheduled',reminder:true},{id:'v3',patient:'p2',type:'Routine antenatal',date:'2026-10-16',time:'09:30',status:'Scheduled',reminder:true},{id:'v4',patient:'p5',type:'Antenatal review',date:'2026-10-16',time:'09:30',status:'Scheduled',reminder:true},{id:'v5',patient:'p4',type:'Routine antenatal',date:'2026-10-15',time:'10:30',status:'Scheduled',reminder:true},{id:'v6',patient:'p3',type:'Routine antenatal',date:'2026-10-14',time:'09:30',status:'Scheduled',reminder:true},{id:'v7',patient:'p6',type:'Routine antenatal',date:'2026-10-18',time:'11:30',status:'Scheduled',reminder:false},{id:'v8',patient:'p1',type:'Routine antenatal',date:'2026-10-16',time:'09:30',status:'Completed',reminder:true},{id:'v9',patient:'p4',type:'Routine antenatal',date:'2026-10-05',time:'09:30',status:'Completed',reminder:true}],observations:[]};
let data=JSON.parse(localStorage.getItem(key)||'null')||initial;let page='overview';let selected=null;
function save(){localStorage.setItem(key,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}function p(id){return data.patients.find(x=>x.id===id)||{name:'Unknown'}}function fmt(d){if(!d)return '—';return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function shell(title,desc,body,action=''){return `<div class="top"><div><h1>${title}</h1><div class="muted">${desc}</div></div><div class="badge">● Online · Local workspace</div></div>${action?`<div class="row" style="margin-bottom:12px">${action}</div>`:''}${body}<div class="notice small">Academic prototype. Fictional sample data only. Not a medical diagnostic tool or approved clinical guidance. Records are stored locally in this browser on this device.</div>`}
function overview(){let scheduled=data.visits.filter(v=>v.status==='Scheduled'), overdue=scheduled.filter(v=>v.date<'2026-10-17').length, upcoming=scheduled.filter(v=>v.date>='2026-10-17').sort((a,b)=>a.date.localeCompare(b.date))[0];return shell('Good morning, care team','A clear view of today’s antenatal follow-up.',`<div class="grid"><div class="card"><div class="muted">Active patients</div><div class="num">${data.patients.length}</div><div class="small">On this device</div></div><div class="card"><div class="muted">Visits today</div><div class="num">${data.visits.filter(v=>v.date==='2026-10-17').length}</div><div class="small">Scheduled / recorded</div></div><div class="card"><div class="muted">Open follow-ups</div><div class="num">${overdue}</div><div class="small">Past scheduled dates</div></div><div class="card"><div class="muted">Observation prompts</div><div class="num">${data.observations.filter(o=>o.flag).length}</div><div class="small">Informational only</div></div></div><div class="section grid" style="grid-template-columns:2fr 1fr"><div class="card"><div class="row"><h2>Upcoming visit</h2><button class="secondary" onclick="page='appointments';render()">View schedule</button></div>${upcoming?`<p><b>${esc(p(upcoming.patient).name)}</b><br>${esc(upcoming.type)} · ${fmt(upcoming.date)} · ${upcoming.time}</p>`:'<div class="empty">No upcoming visits.</div>'}</div><div class="card"><h2>Desk alerts</h2>${overdue?`<div class="alert">${overdue} scheduled visit(s) need follow-up.</div>`:'<div class="alert good">No overdue scheduled visits.</div>'}${data.observations.filter(o=>o.flag).length?`<div class="alert">${data.observations.filter(o=>o.flag).length} observation review prompt(s).</div>`:''}</div></div>`,'<button class="primary" onclick="openPatient()">+ Register patient</button>')}
function patients(){return shell('Patient register','Find and maintain antenatal records saved on this device.',`<div class="card"><div class="row"><div><b>${data.patients.length} records</b></div><button class="primary" onclick="openPatient()">Register patient</button></div><input id="search" class="search" placeholder="Search name, phone or village" oninput="renderPatients(this.value)"><div id="plist"></div></div>`);setTimeout(()=>renderPatients(''),0)}
function renderPatients(q){let arr=data.patients.filter(x=>(x.name+x.phone+x.village).toLowerCase().includes((q||'').toLowerCase()));document.getElementById('plist').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Patient</th><th>Village</th><th>Phone</th><th>Pregnancy</th><th>Record</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.village)}</td><td>${esc(x.phone)}</td><td>${x.due?'Due '+fmt(x.due):'—'}</td><td><button class="secondary" onclick="openRecord('${x.id}')">Open record</button></td></tr>`).join('')}</tbody></table></div>`}
function appointments(){return shell('Visit coordination','Plan follow-up and record visit outcomes in your local schedule.',`<div class="card"><div class="row"><b>${data.visits.length} scheduled/history records</b><button class="primary" onclick="openVisit()">Schedule visit</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Patient · visit</th><th>Date & time</th><th>Status</th><th>Reminder</th><th>Actions</th></tr></thead><tbody>${data.visits.map(v=>`<tr><td><b>${esc(p(v.patient).name)}</b><br><span class="small">${esc(v.type)}</span></td><td>${fmt(v.date)}<br>${v.time}</td><td>${esc(v.status)}</td><td>${v.reminder?'On':'Off'}</td><td class="actions"><button class="secondary" onclick="doneVisit('${v.id}')">${v.status==='Scheduled'?'Done':'View'}</button></td></tr>`).join('')}</tbody></table></div></div>`)}
function observations(){return shell('Observations','Record visit observations and review transparent rule prompts.',`<div class="card"><div class="row"><b>${data.observations.length} observations</b><button class="primary" onclick="openObservation()">Record observation</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Patient</th><th>Date</th><th>BP</th><th>Weight</th><th>Notes</th><th>Review</th></tr></thead><tbody>${data.observations.map(o=>`<tr><td>${esc(p(o.patient).name)}</td><td>${fmt(o.date)}</td><td>${esc(o.systolic)}/${esc(o.diastolic)} mmHg</td><td>${esc(o.weight||'—')} kg</td><td>${esc(o.notes||'—')}</td><td>${o.flag?'<span class="pill">Review BP rule</span>':'Normal rule check'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No observations recorded yet.</td></tr>'}</tbody></table></div></div>`)}
function referrals(){let flags=data.observations.filter(o=>o.flag);return shell('Referral support','Transparent, configurable prompts based on recorded observations.','<div class="card"><h2>Review prompts</h2>'+ (flags.map(o=>`<div class="alert"><b>${esc(p(o.patient).name)}</b> · ${fmt(o.date)}<br>Source observation: BP ${esc(o.systolic)}/${esc(o.diastolic)} mmHg. Rule: systolic ≥ 140 or diastolic ≥ 90. This is an informational prompt, not a diagnosis or referral recommendation.</div>`).join('')||'<div class="alert good">No current observation prompts.</div>')+'</div>')}
function settings(){return shell('Settings','Local workspace and prototype disclosures.',`<div class="card"><h2>Kwaso Community Clinic</h2><p>Device-only demo record</p><p class="muted">Patient and visit details are stored only in this browser. There is no cloud sync or remote backup.</p><button class="secondary" onclick="if(confirm('Reset all demo data?')){localStorage.removeItem(key);location.reload()}">Reset demo data</button></div>`)}
function openPatient(){dialog.innerHTML=`<h2>Register patient</h2><div class="formgrid"><div class="field"><label>Full name *</label><input id="pn"></div><div class="field"><label>Phone</label><input id="pp"></div><div class="field"><label>Village</label><input id="pv"></div><div class="field"><label>Pregnancy</label><input id="pg" placeholder="G1 P0"></div><div class="field"><label>Expected due date</label><input id="pd" type="date"></div></div><div class="actions" style="margin-top:16px"><button class="primary" onclick="addPatient()">Save patient</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`;modal.classList.add('open')}
function addPatient(){let name=pn.value.trim();if(!name)return alert('Patient name is required.');data.patients.push({id:'p'+Date.now(),name,phone:pp.value,village:pv.value,preg:pg.value,due:pd.value});save();closeModal();render()}
function openVisit(){dialog.innerHTML=`<h2>Schedule visit</h2><div class="formgrid"><div class="field full"><label>Patient *</label><select id="vp">${data.patients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Visit type</label><input id="vt" value="Routine antenatal"></div><div class="field"><label>Date *</label><input id="vd" type="date" value="2026-10-19"></div><div class="field"><label>Time</label><input id="vm" type="time" value="09:30"></div><div class="field"><label>Reminder</label><select id="vr"><option value="1">On</option><option value="0">Off</option></select></div></div><div class="actions" style="margin-top:16px"><button class="primary" onclick="addVisit()">Save visit</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`;modal.classList.add('open')}
function addVisit(){if(!vd.value)return alert('Date is required.');data.visits.push({id:'v'+Date.now(),patient:vp.value,type:vt.value,date:vd.value,time:vm.value,status:'Scheduled',reminder:vr.value==='1'});save();closeModal();render()}
function doneVisit(id){let v=data.visits.find(x=>x.id===id);if(v&&v.status==='Scheduled'){v.status='Completed';save();render()}}
function openObservation(){dialog.innerHTML=`<h2>Record antenatal observation</h2><div class="formgrid"><div class="field"><label>Patient *</label><select id="op">${data.patients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Date *</label><input id="od" type="date" value="2026-10-17"></div><div class="field"><label>Systolic BP (mmHg)</label><input id="os" type="number" min="0"></div><div class="field"><label>Diastolic BP (mmHg)</label><input id="oo" type="number" min="0"></div><div class="field"><label>Weight (kg)</label><input id="ow" type="number" step="0.1"></div><div class="field full"><label>Notes</label><textarea id="on"></textarea></div></div><div class="actions" style="margin-top:16px"><button class="primary" onclick="addObservation()">Save observation</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`;modal.classList.add('open')}
function addObservation(){let systolic=Number(os.value)||0,diastolic=Number(oo.value)||0;if(!od.value)return alert('Date is required.');let flag=systolic>=140||diastolic>=90;data.observations.push({id:'o'+Date.now(),patient:op.value,date:od.value,systolic:systolic||'—',diastolic:diastolic||'—',weight:ow.value,notes:on.value,flag});save();closeModal();render()}
function openRecord(id){let x=p(id), obs=data.observations.filter(o=>o.patient===id);dialog.innerHTML=`<h2>${esc(x.name)}</h2><p>${esc(x.village)} · ${esc(x.phone)} · ${esc(x.preg)}</p><hr><h3>Observation history</h3>${obs.map(o=>`<div class="card" style="margin:8px 0">${fmt(o.date)} · BP ${esc(o.systolic)}/${esc(o.diastolic)} · ${esc(o.weight||'—')} kg${o.flag?' · <b>Review prompt</b>':''}<br>${esc(o.notes||'')}</div>`).join('')||'<div class="empty">No observations yet.</div>'}<div class="actions" style="margin-top:15px"><button class="primary" onclick="closeModal();openObservationFor('${id}')">Add observation</button><button class="secondary" onclick="closeModal()">Close</button></div>`;modal.classList.add('open')}
function openObservationFor(id){openObservation();setTimeout(()=>{op.value=id},0)}function closeModal(){modal.classList.remove('open')}modal.onclick=e=>{if(e.target===modal)closeModal()}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let el=document.getElementById('app');if(page==='overview')el.innerHTML=overview();if(page==='patients')el.innerHTML=patients();if(page==='appointments')el.innerHTML=appointments();if(page==='observations')el.innerHTML=observations();if(page==='referrals')el.innerHTML=referrals();if(page==='settings')el.innerHTML=settings()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});render();
</script></body></html>
